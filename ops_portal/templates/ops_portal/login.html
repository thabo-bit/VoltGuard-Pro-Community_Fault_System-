<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ops Login | VoltGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #fff7ed; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid white; }
    </style>
</head>
<body class="h-screen flex items-center justify-center">
    <div class="glass p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md border-orange-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-orange-500 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-orange-200">
                <span class="text-white font-black">VG</span>
            </div>
            <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Ops <span class="text-orange-500">Access</span></h2>
            <p class="text-slate-400 text-sm font-medium">Internal Technical Portal</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 mb-2">Technician ID</label>
                <input type="text" name="username" class="w-full px-6 py-4 rounded-2xl bg-white border border-slate-100 focus:border-orange-300 focus:ring-0 transition outline-none text-slate-700 font-bold" placeholder="e.g. TECH-001">
            </div>
            <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 mb-2">Access Key</label>
                <input type="password" name="password" class="w-full px-6 py-4 rounded-2xl bg-white border border-slate-100 focus:border-orange-300 focus:ring-0 transition outline-none text-slate-700" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-orange-200 transition-all active:scale-95 uppercase tracking-widest text-xs">
                Authorize Access
            </button>
        </form>
    </div>
</body>
</html>
